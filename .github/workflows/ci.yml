name: ci

# Pipeline for the MaltaShop prototype. Gates run in order; a failure stops the
# pipeline before anything later runs:
#   1. test   - saga, compensation, idempotency and log-schema tests (seconds, no Docker)
#   2. build  - every service image builds (multi-stage, non-root)
#   3. smoke  - the whole stack starts with `docker compose up` and the three
#               saga outcomes are verified end to end through the REST API
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run saga tests
        run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build --tag maltashop/${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and wait for every health check
        run: docker compose up --build --detach --wait
      - name: End-to-end smoke test
        run: ./scripts/smoke_test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
